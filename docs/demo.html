<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Website preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;box-sizing:border-box}
  img{max-width:100%;display:block}
  a{text-decoration:none;color:inherit}
  body{background:#0b0b0d}
  /* ---------- style switcher ---------- */
  #switch{position:fixed;z-index:99;right:14px;bottom:14px;display:flex;gap:6px;background:rgba(15,17,22,.82);
    backdrop-filter:blur(10px);padding:6px;border-radius:999px;border:1px solid rgba(255,255,255,.14);box-shadow:0 10px 30px rgba(0,0,0,.4)}
  #switch button{border:0;cursor:pointer;font:600 12px/1 Inter,sans-serif;color:#cfd6e4;background:transparent;padding:8px 13px;border-radius:999px;letter-spacing:.03em}
  #switch button.on{background:#fff;color:#111}
  #ribbon{position:fixed;z-index:98;top:0;left:0;right:0;font:500 12.5px/1.4 Inter,sans-serif;text-align:center;
    padding:8px 44px 8px 14px;background:#0b0b0d;color:#c9cfda}
  #ribbon b{color:#fff}
  #app{padding-top:34px}
  .btnx{border:0;cursor:pointer;font:inherit}

  /* ============================================================ AURELIA (luxury noir) */
  [data-t="aurelia"]{--ink:#0d0d0f;--paper:#12100e;--cream:#f4efe6;--muted:#a79f90;--gold:#c9a54e;--line:rgba(244,239,230,.14)}
  .aurelia{background:var(--paper);color:var(--cream);font-family:Inter,sans-serif}
  .aurelia .kicker{font:600 11px/1 Inter;letter-spacing:.32em;text-transform:uppercase;color:var(--gold)}
  .aurelia .wrap{max-width:1160px;margin:auto;padding:0 28px}
  .aurelia nav{display:flex;justify-content:space-between;align-items:center;padding:26px 28px;max-width:1160px;margin:auto}
  .aurelia .logo{font:600 24px/1 "Playfair Display",serif;letter-spacing:.02em}
  .aurelia .logo i{color:var(--gold);font-style:normal}
  .aurelia .navlinks{display:flex;gap:30px;font:500 13px/1 Inter;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  @media(max-width:760px){.aurelia .navlinks{display:none}}
  .aurelia .hero{position:relative;min-height:88vh;display:flex;align-items:flex-end;
    background:linear-gradient(180deg,rgba(13,13,15,.35),rgba(13,13,15,.9)),url('https://images.unsplash.com/photo-1613490493576-7fde63acd811?w=1600&q=80') center/cover}
  .aurelia .hero-in{max-width:1160px;margin:auto;width:100%;padding:0 28px 76px}
  .aurelia .hero h1{font:600 clamp(42px,7vw,86px)/1.02 "Playfair Display",serif;letter-spacing:-.01em;max-width:16ch;margin:18px 0 0}
  .aurelia .hero h1 em{font-style:italic;color:var(--gold)}
  .aurelia .hero p{font:400 18px/1.6 "Cormorant Garamond",serif;font-size:21px;color:#e7e0d3;max-width:46ch;margin-top:20px}
  .aurelia .rule{height:1px;background:var(--line);margin:0}
  .aurelia .figures{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin:0}
  .aurelia .fig{background:var(--paper);padding:34px 28px}
  .aurelia .fig b{font:600 40px/1 "Playfair Display",serif;color:var(--cream)}
  .aurelia .fig span{display:block;margin-top:8px;font:500 11px/1.4 Inter;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
  .aurelia section{padding:92px 0}
  .aurelia h2{font:600 clamp(30px,4vw,46px)/1.08 "Playfair Display",serif;letter-spacing:-.01em;margin:14px 0 0}
  .aurelia .lead{color:var(--muted);font:400 18px/1.7 "Cormorant Garamond",serif;font-size:20px;max-width:52ch;margin-top:16px}
  .aurelia .props{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;margin-top:48px}
  @media(max-width:860px){.aurelia .props{grid-template-columns:1fr 1fr}}@media(max-width:560px){.aurelia .props{grid-template-columns:1fr}}
  .aurelia .card{border:1px solid var(--line);background:#100e0c}
  .aurelia .card .ph{aspect-ratio:4/3;background-size:cover;background-position:center;filter:saturate(.92)}
  .aurelia .card .cb{padding:20px 22px 24px}
  .aurelia .card .tag{font:600 10px/1 Inter;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
  .aurelia .card .price{font:600 27px/1 "Playfair Display",serif;margin:12px 0 6px}
  .aurelia .card .meta{color:var(--muted);font:400 15px/1.5 Inter}
  .aurelia .quote{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:80px 0;text-align:center}
  .aurelia .quote p{font:500 clamp(24px,3.4vw,38px)/1.35 "Playfair Display",serif;max-width:20ch;margin:0 auto;font-style:italic}
  .aurelia .quote span{display:block;margin-top:24px;font:500 12px/1 Inter;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
  .aurelia .cta{display:inline-block;border:1px solid var(--gold);color:var(--gold);padding:15px 34px;font:600 12px/1 Inter;letter-spacing:.2em;text-transform:uppercase;transition:.25s}
  .aurelia .cta:hover{background:var(--gold);color:#12100e}
  .aurelia .cta.solid{background:var(--gold);color:#12100e}
  .aurelia footer{border-top:1px solid var(--line);padding:44px 0;color:var(--muted);font:400 14px/1.6 Inter}
  .aurelia footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px}

  /* ============================================================ MARLOW (modern clean) */
  [data-t="marlow"]{--navy:#0c1b33;--ink:#16233b;--slate:#5b6b84;--mist:#eef2f8;--accent:#127a63;--accent2:#1aa17f;--line:#e4e9f1}
  .marlow{background:#fff;color:var(--ink);font-family:Inter,sans-serif}
  .marlow .wrap{max-width:1180px;margin:auto;padding:0 26px}
  .marlow nav{position:sticky;top:34px;z-index:20;background:rgba(255,255,255,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .marlow nav .in{max-width:1180px;margin:auto;padding:16px 26px;display:flex;align-items:center;justify-content:space-between}
  .marlow .logo{font:700 22px/1 "Space Grotesk",sans-serif;color:var(--navy)}
  .marlow .logo i{color:var(--accent);font-style:normal}
  .marlow .navlinks{display:flex;gap:26px;color:var(--slate);font:500 14px/1 Inter}
  @media(max-width:820px){.marlow .navlinks{display:none}}
  .marlow .pill{background:var(--navy);color:#fff;padding:11px 20px;border-radius:999px;font:600 14px/1 Inter}
  .marlow .hero{max-width:1180px;margin:auto;padding:64px 26px 30px;display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center}
  @media(max-width:860px){.marlow .hero{grid-template-columns:1fr;padding-top:40px}}
  .marlow .hero h1{font:700 clamp(38px,5.4vw,62px)/1.05 "Space Grotesk",sans-serif;letter-spacing:-.02em;color:var(--navy)}
  .marlow .hero h1 mark{background:linear-gradient(transparent 62%,#a9e7d6 62%);color:inherit;padding:0 2px}
  .marlow .hero p{margin-top:18px;font:400 18px/1.65 Inter;color:var(--slate);max-width:46ch}
  .marlow .heroimg{border-radius:22px;overflow:hidden;box-shadow:0 30px 60px rgba(12,27,51,.18);aspect-ratio:4/3;background-size:cover;background-position:center}
  .marlow .search{margin-top:26px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px;display:flex;gap:8px;flex-wrap:wrap;box-shadow:0 16px 40px rgba(12,27,51,.08)}
  .marlow .search input,.marlow .search select{flex:1;min-width:120px;border:0;padding:13px;font:inherit;color:var(--ink);background:transparent}
  .marlow .search .go{background:var(--accent);color:#fff;border-radius:11px;padding:13px 24px;font:600 15px/1 Inter}
  .marlow .figs{max-width:1180px;margin:26px auto 0;padding:0 26px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  @media(max-width:640px){.marlow .figs{grid-template-columns:1fr 1fr}}
  .marlow .fig{background:var(--mist);border-radius:16px;padding:22px}
  .marlow .fig b{font:700 30px/1 "Space Grotesk",sans-serif;color:var(--accent)}
  .marlow .fig span{display:block;margin-top:6px;color:var(--slate);font:500 13px/1.4 Inter}
  .marlow section{max-width:1180px;margin:auto;padding:76px 26px}
  .marlow h2{font:700 clamp(28px,3.6vw,42px)/1.1 "Space Grotesk",sans-serif;letter-spacing:-.01em;color:var(--navy)}
  .marlow .sub{color:var(--slate);margin-top:10px;font:400 17px/1.6 Inter}
  .marlow .props{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:36px}
  @media(max-width:860px){.marlow .props{grid-template-columns:1fr 1fr}}@media(max-width:560px){.marlow .props{grid-template-columns:1fr}}
  .marlow .card{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff;transition:.25s;box-shadow:0 8px 26px rgba(12,27,51,.05)}
  .marlow .card:hover{transform:translateY(-4px);box-shadow:0 22px 50px rgba(12,27,51,.13)}
  .marlow .card .ph{aspect-ratio:16/11;background-size:cover;background-position:center}
  .marlow .card .cb{padding:16px 18px 20px}
  .marlow .card .tag{display:inline-block;background:#e7f5f0;color:var(--accent);font:600 11px/1 Inter;padding:5px 10px;border-radius:7px}
  .marlow .card .price{font:700 22px/1 "Space Grotesk",sans-serif;color:var(--navy);margin:12px 0 5px}
  .marlow .card .meta{color:var(--slate);font:400 14px/1.5 Inter}
  .marlow .band{background:var(--navy);color:#fff;border-radius:26px;margin:0 26px;max-width:1180px}
  .marlow .band .in{max-width:1180px;margin:auto;padding:54px 40px;display:flex;gap:26px;flex-wrap:wrap;align-items:center;justify-content:space-between}
  .marlow .band h2{color:#fff}.marlow .band .pill{background:var(--accent2)}
  .marlow footer{max-width:1180px;margin:40px auto 0;padding:34px 26px;border-top:1px solid var(--line);color:var(--slate);font:400 14px/1.6 Inter;display:flex;justify-content:space-between;flex-wrap:wrap;gap:14px}

  /* ============================================================ SIENNA (warm boutique) */
  [data-t="sienna"]{--ink:#33291f;--terra:#c15f3c;--terra-d:#a44a2c;--sage:#7c8a6f;--cream:#f6efe4;--card:#fbf6ee;--muted:#8a7d6b;--line:#e8ddcb}
  .sienna{background:var(--cream);color:var(--ink);font-family:Inter,sans-serif}
  .sienna .wrap{max-width:1140px;margin:auto;padding:0 26px}
  .sienna nav{display:flex;justify-content:space-between;align-items:center;max-width:1140px;margin:auto;padding:24px 26px}
  .sienna .logo{font:600 25px/1 Fraunces,serif;color:var(--terra-d)}
  .sienna .navlinks{display:flex;gap:26px;color:var(--ink);font:500 14px/1 Inter}
  @media(max-width:820px){.sienna .navlinks{display:none}}
  .sienna .pill{background:var(--terra);color:#fff;padding:11px 21px;border-radius:999px;font:600 14px/1 Inter}
  .sienna .hero{max-width:1140px;margin:auto;padding:36px 26px 20px;display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:center}
  @media(max-width:860px){.sienna .hero{grid-template-columns:1fr}}
  .sienna .hero .k{font:600 12px/1 Inter;letter-spacing:.18em;text-transform:uppercase;color:var(--sage)}
  .sienna .hero h1{font:600 clamp(40px,5.6vw,66px)/1.04 Fraunces,serif;margin-top:14px;letter-spacing:-.01em}
  .sienna .hero h1 em{font-style:italic;color:var(--terra)}
  .sienna .hero p{margin-top:18px;font:400 18px/1.7 Inter;color:var(--muted);max-width:44ch}
  .sienna .hero .cta{display:inline-block;margin-top:24px;background:var(--terra);color:#fff;padding:14px 28px;border-radius:999px;font:600 15px/1 Inter;transition:.2s}
  .sienna .hero .cta:hover{background:var(--terra-d)}
  .sienna .heroimg{aspect-ratio:5/6;border-radius:200px 200px 22px 22px;overflow:hidden;background-size:cover;background-position:center;box-shadow:0 30px 60px rgba(120,80,40,.2)}
  .sienna .figs{max-width:1140px;margin:20px auto 0;padding:0 26px;display:flex;gap:38px;flex-wrap:wrap}
  .sienna .fig b{font:600 34px/1 Fraunces,serif;color:var(--terra)}
  .sienna .fig span{color:var(--muted);font:500 13px/1.4 Inter}
  .sienna section{max-width:1140px;margin:auto;padding:72px 26px}
  .sienna h2{font:600 clamp(30px,4vw,44px)/1.1 Fraunces,serif}
  .sienna .sub{color:var(--muted);margin-top:10px;font:400 17px/1.6 Inter}
  .sienna .props{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:36px}
  @media(max-width:860px){.sienna .props{grid-template-columns:1fr 1fr}}@media(max-width:560px){.sienna .props{grid-template-columns:1fr}}
  .sienna .card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;transition:.25s}
  .sienna .card:hover{transform:translateY(-4px);box-shadow:0 20px 44px rgba(120,80,40,.14)}
  .sienna .card .ph{aspect-ratio:4/3;background-size:cover;background-position:center}
  .sienna .card .cb{padding:17px 19px 21px}
  .sienna .card .tag{display:inline-block;background:#ecefe6;color:var(--sage);font:600 11px/1 Inter;padding:5px 11px;border-radius:999px}
  .sienna .card .price{font:600 24px/1 Fraunces,serif;color:var(--terra-d);margin:12px 0 5px}
  .sienna .card .meta{color:var(--muted);font:400 14px/1.5 Inter}
  .sienna .band{background:var(--sage);color:#fff;border-radius:28px;margin:0 26px;max-width:1140px}
  .sienna .band .in{max-width:1140px;margin:auto;padding:52px 40px;display:flex;gap:24px;flex-wrap:wrap;align-items:center;justify-content:space-between}
  .sienna .band h2{color:#fff;max-width:20ch}.sienna .band .pill{background:#fff;color:var(--sage)}
  .sienna footer{max-width:1140px;margin:auto;padding:38px 26px;border-top:1px solid var(--line);color:var(--muted);font:400 14px/1.6 Inter;display:flex;justify-content:space-between;flex-wrap:wrap;gap:14px}
</style>
</head>
<body>
<div id="ribbon">✦ A free <b>concept preview</b> built for <b id="rbname">this agency</b>. Try the styles bottom-right. Reply to the email to make it real.</div>
<div id="switch">
  <button data-s="aurelia">Aurelia</button>
  <button data-s="marlow">Marlow</button>
  <button data-s="sienna">Sienna</button>
</div>
<div id="app"></div>

<script>
const p = new URLSearchParams(location.search);
const NAME = p.get("name") || "Your Agency";
const CITY = p.get("city") || "your city";
const PHONE = (p.get("phone") || "").trim();
const ADDR = p.get("addr") || (CITY + " high street");
const TEL = PHONE ? "tel:" + PHONE.replace(/\s/g,"") : "#";
document.title = NAME + " · preview";
document.getElementById("rbname").textContent = NAME;

// deterministic per-business defaults so the same agency always gets the same look/prices
function hash(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))>>>0; } return h; }
const H = hash(NAME + CITY);
const PHOTOS = ["1568605114967-8130f3a36994","1570129477492-45c003edd2be","1512917774080-9991f1c4c750",
  "1600585154340-be6161a56a0c","1600607687939-ce8a6c25118c","1580587771525-78b9dba3b914",
  "1580216643062-cf460548a66a","1600566753086-00f18fb6b3ea","1605276374104-dee2a0ed3cd6"];
const HEROES = {
  aurelia:"1613490493576-7fde63acd811", marlow:"1600596542815-ffad4c1539a9", sienna:"1600607687920-4e2a09cf159d"};
const CUR = {"United Kingdom":"£","Ireland":"€","USA":"$","Canada":"$","Australia":"$","Germany":"€","France":"€","Spain":"€","Italy":"€","Netherlands":"€","Portugal":"€"};
const cur = CUR[p.get("country")] || "£";
function listings(n){
  const out=[]; const tags=["For sale","To let","New","For sale","New","To let"];
  for(let i=0;i<n;i++){
    const ph=PHOTOS[(H+i*3)%PHOTOS.length];
    const price=((H>>(i+2))%850+180);
    out.push({img:`https://images.unsplash.com/photo-${ph}?w=700&q=70`,price:cur+price.toLocaleString()+",000",
      beds:2+(H+i)%4, baths:1+(H+i)%3, tag:tags[i%tags.length]});
  }
  return out;
}
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const T = {
  aurelia: () => {
    const L = listings(6).map(x=>`<div class="card"><div class="ph" style="background-image:url('${x.img}')"></div>
      <div class="cb"><div class="tag">${x.tag}</div><div class="price">${x.price}</div>
      <div class="meta">${x.beds} bedrooms · ${x.baths} bath · ${esc(CITY)}</div></div></div>`).join("");
    return `<div class="aurelia">
      <nav><div class="logo">${esc(NAME)}<i>.</i></div>
        <div class="navlinks"><a>Sales</a><a>Lettings</a><a>Valuations</a><a>Journal</a><a>Contact</a></div></nav>
      <header class="hero"><div class="hero-in">
        <div class="kicker">Distinguished homes · ${esc(CITY)}</div>
        <h1>Property, presented <em>beautifully</em>.</h1>
        <p>A boutique estate agency pairing local expertise with a considered, design-led approach to selling and letting.</p>
        <p style="margin-top:30px"><a class="cta solid" href="${TEL}">Arrange a valuation</a></p>
      </div></header>
      <div class="figures">
        <div class="fig"><b>£1.2b</b><span>Property sold</span></div>
        <div class="fig"><b>28</b><span>Days to offer, avg</span></div>
        <div class="fig"><b>4.9</b><span>Client rating</span></div>
        <div class="fig"><b>15 yrs</b><span>In ${esc(CITY)}</span></div>
      </div>
      <div class="wrap"><section>
        <div class="kicker">Featured</div><h2>A selection from our portfolio</h2>
        <p class="lead">Handpicked homes across ${esc(CITY)} and the surrounding area, each marketed with striking photography and honest guidance.</p>
        <div class="props">${L}</div>
      </section></div>
      <div class="quote"><div class="wrap"><p>“They sold our home in eleven days, for more than we hoped.”</p>
        <span>A recent ${esc(CITY)} seller</span></div></div>
      <div class="wrap"><section style="text-align:center">
        <div class="kicker">Thinking of moving?</div><h2>Let's talk about your property</h2>
        <p class="lead" style="margin:16px auto 30px">A confidential, no-obligation valuation from people who know ${esc(CITY)} inside out.</p>
        <a class="cta" href="${TEL}">Book a valuation</a>
      </section></div>
      <footer><div class="wrap"><div><b>${esc(NAME)}</b> · ${esc(ADDR)}${PHONE?" · "+esc(PHONE):""}</div>
        <div>A concept preview, crafted to show what's possible.</div></div></footer>
    </div>`;
  },
  marlow: () => {
    const L = listings(6).map(x=>`<div class="card"><div class="ph" style="background-image:url('${x.img}')"></div>
      <div class="cb"><span class="tag">${x.tag}</span><div class="price">${x.price}</div>
      <div class="meta">${x.beds} bed · ${x.baths} bath · ${esc(CITY)}</div></div></div>`).join("");
    return `<div class="marlow">
      <nav><div class="in"><div class="logo">${esc(NAME)}<i>.</i></div>
        <div class="navlinks"><a>Buy</a><a>Rent</a><a>Sell</a><a>Mortgages</a><a>About</a></div>
        <a class="pill" href="${TEL}">Contact us</a></div></nav>
      <header class="hero">
        <div><h1>Find your next home in <mark>${esc(CITY)}</mark>.</h1>
          <p>Modern, straightforward estate agency. Browse live listings, book viewings online, and get moving faster.</p>
          <div class="search"><input placeholder="Search area or postcode…"><select><option>Buy</option><option>Rent</option></select><button class="go btnx">Search</button></div>
        </div>
        <div class="heroimg" style="background-image:url('https://images.unsplash.com/photo-${HEROES.marlow}?w=1000&q=80')"></div>
      </header>
      <div class="figs">
        <div class="fig"><b>450+</b><span>Live listings</span></div>
        <div class="fig"><b>24h</b><span>Viewing turnaround</span></div>
        <div class="fig"><b>4.9★</b><span>Google rating</span></div>
        <div class="fig"><b>1,200+</b><span>Happy movers</span></div>
      </div>
      <section><h2>Featured properties</h2><div class="sub">Fresh to market across ${esc(CITY)}.</div>
        <div class="props">${L}</div></section>
      <div class="band"><div class="in"><h2>Thinking of selling? Get a free instant valuation.</h2>
        <a class="pill" href="${TEL}">Book a valuation</a></div></div>
      <section><h2>Why ${esc(NAME)}</h2>
        <div class="props" style="margin-top:28px">
          <div class="card"><div class="cb"><span class="tag">Local</span><div class="price" style="font-size:19px">Area specialists</div><div class="meta">We know every street, school and shortcut in ${esc(CITY)}.</div></div></div>
          <div class="card"><div class="cb"><span class="tag">Fast</span><div class="price" style="font-size:19px">Viewings in 24h</div><div class="meta">Book online and hear back the same day.</div></div></div>
          <div class="card"><div class="cb"><span class="tag">Honest</span><div class="price" style="font-size:19px">Straight advice</div><div class="meta">Clear guidance from first viewing to completion.</div></div></div>
        </div></section>

  sienna: () => {

    return `<div class="sienna">

        <div class="fig"><b>${esc(CITY)}</b><span>Born and based here</span></div>
      </div>
      <section><h2>Homes we're loving right now</h2><div class="sub">A handpicked few from across ${esc(CITY)}.</div>
        <div class="props">${L}</div></section>

        <a class="pill" href="${TEL}">Get a free valuation</a></div></div>

          <div class="card"><div class="cb"><span class="tag">Rooted</span><div class="price" style="font-size:20px">Truly local</div><div class="meta">We live and work in ${esc(CITY)}, and it shows.</div></div></div>

};

const STYLES = ["aurelia","marlow","sienna"];
function paint(style){
  document.body.setAttribute("data-t", style);
  document.getElementById("app").innerHTML = T[style]();
  document.querySelectorAll("#switch button").forEach(b => b.classList.toggle("on", b.dataset.s === style));
  try { history.replaceState(null, "", "?" + new URLSearchParams({...Object.fromEntries(p), t: style}).toString()); } catch(e){}
  scrollTo(0,0);
}
document.getElementById("switch").addEventListener("click", e => { const s=e.target.dataset.s; if(s) paint(s); });
paint(STYLES.includes(p.get("t")) ? p.get("t") : STYLES[H % STYLES.length]);
</script>
