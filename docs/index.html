<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>leadscout</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1b1f24;--mut:#5e6772;--line:#e2e5ea;--acc:#2563eb;--ok:#16a34a;--warn:#d97706;--pill:#eef1f6}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#171a20;--fg:#e6e8eb;--mut:#9aa3ad;--line:#2a2f37;--acc:#60a5fa;--ok:#4ade80;--warn:#fbbf24;--pill:#1e232c}}
:root[data-theme=light]{--bg:#f6f7f9;--card:#fff;--fg:#1b1f24;--mut:#5e6772;--line:#e2e5ea;--acc:#2563eb;--ok:#16a34a;--warn:#d97706;--pill:#eef1f6}
:root[data-theme=dark]{--bg:#0f1115;--card:#171a20;--fg:#e6e8eb;--mut:#9aa3ad;--line:#2a2f37;--acc:#60a5fa;--ok:#4ade80;--warn:#fbbf24;--pill:#1e232c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:1180px;margin:auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;justify-content:space-between}
h1{font-size:20px;margin:0}h1 small{font-weight:400;color:var(--mut);font-size:13px}
.mut{color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:14px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.stat b{display:block;font-size:22px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
input,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg)}
input[type=search]{flex:1;min-width:180px}
label.ck{color:var(--mut);display:inline-flex;gap:5px;align-items:center}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px;padding:7px 12px;font:inherit}
.btn.p{background:var(--acc);color:#fff;border-color:var(--acc)}
.row{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:11px 13px;margin-bottom:8px}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.name{font-weight:600;font-size:15px}
.pill{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--pill);color:var(--mut)}
.pill.brand{color:var(--acc)}
.contacts{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.contacts a{display:inline-flex;gap:5px;align-items:center;text-decoration:none;font-size:12.5px;padding:3px 9px;border-radius:6px;border:1px solid var(--line);color:var(--fg)}
.contacts a.email{border-color:var(--ok);color:var(--ok)}
.contacts a.phone{border-color:var(--acc);color:var(--acc)}
.contacts a.ch{color:var(--warn);border-color:var(--warn)}
.addr{color:var(--mut);font-size:12px;margin-top:5px}
.weak{margin-top:7px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.wchip{font-size:11px;padding:2px 8px;border-radius:6px;background:rgba(217,119,6,.12);color:var(--warn);border:1px solid rgba(217,119,6,.35)}
.wchip.ok{background:rgba(22,163,74,.12);color:var(--ok);border-color:rgba(22,163,74,.35)}
.draftbox{margin-top:9px;border-top:1px dashed var(--line);padding-top:9px}
.draftbox textarea{width:100%;min-height:150px;font:12.5px/1.5 ui-monospace,monospace;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);resize:vertical}
.draftbox .subj{font-weight:600;margin-bottom:6px}
.draftbox .acts{display:flex;gap:8px;margin-top:7px;flex-wrap:wrap}
.empty{padding:30px;text-align:center;color:var(--mut)}
#more{display:block;margin:10px auto}#more[hidden]{display:none}
.note{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:8px;padding:10px 12px;margin-bottom:12px;color:var(--mut);font-size:13px}
</style>
</head>
<body>
<main>
<header>
  <h1>🏘️ leadscout <small>real-estate providers without a website</small></h1>
  <span class="mut" id="meta">loading…</span>
</header>

<div class="stats" id="stats"></div>
<div class="note" id="note"></div>

<div class="bar">
  <input type="search" id="q" placeholder="Search name, city, brand, phone, email…">
  <select id="country"><option value="">All countries</option></select>
  <select id="seg"><option value="">Both segments</option><option value="nosite">No website (build)</option><option value="site">Has website (redesign)</option></select>
  <select id="has">
    <option value="">Any contact</option>
    <option value="email">Has email</option>
    <option value="phone">Has phone</option>
    <option value="campaign">Campaign-ready (email + legal)</option>
    <option value="channel">Has a social channel</option>
    <option value="emailable">Email or a channel</option>
  </select>
  <label class="ck"><input type="checkbox" id="best" checked> Best-fit prospects only</label>
  <button class="btn p" id="csv">Export CSV</button>
</div>

<div id="out"></div>
<button id="more" hidden class="btn">Show more</button>
</main>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const CH_URL = {
  facebook: v => v.startsWith("http") ? v : "https://facebook.com/" + v,
  instagram: v => v.startsWith("http") ? v : "https://instagram.com/" + v.replace(/^@/, ""),
  whatsapp: v => "https://wa.me/" + v.replace(/[^0-9]/g, ""),
  linkedin: v => v.startsWith("http") ? v : "https://linkedin.com/" + v,
  twitter: v => v.startsWith("http") ? v : "https://twitter.com/" + v.replace(/^@/, ""),
  tiktok: v => v.startsWith("http") ? v : "https://tiktok.com/@" + v.replace(/^@/, ""),
  youtube: v => v.startsWith("http") ? v : "https://youtube.com/" + v,
  telegram: v => v.startsWith("http") ? v : "https://t.me/" + v.replace(/^@/, ""),
};
function demoLink(l){
  const base = location.origin + location.pathname.replace(/[^/]*$/, "") + "demo.html";
  const q = new URLSearchParams({ name: l.name || "", city: l.city || "", phone: l.phone || "", addr: l.addr || "" });
  return base + "?" + q.toString();
}
// Localized cold-email templates. {name} {city} {hook} {demo} are filled per lead. Each ends with an opt-out line.
const DRAFTS = {
  en:{s:"A quick idea for {name}'s website",
    b:"Hi {name} team,\n\nI came across {name} while looking at estate agents in {city}, and I noticed {hook}.\n\nI put together a free concept preview of how a modern, mobile-first site could look for you:\n{demo}\n\nIf it's useful, I'd love to build the real thing. Happy to send more examples or jump on a quick call.\n\nBest,\n[Your Name]\n\nNot interested? Just reply 'no thanks' and I won't follow up.",
    h:{mobile:"your site isn't mobile-friendly, and most property searches now happen on phones",https:"your site isn't secure (no HTTPS), which browsers now flag to visitors",outdated:"your site looks like it hasn't been updated in a few years",slow:"your site loads slowly, which loses visitors before they enquire",dated_build:"your site's design looks dated next to competitors",generic:"a more modern site could turn more of your visitors into enquiries"}},
  de:{s:"Eine kurze Idee fuer die Website von {name}",
    b:"Hallo Team von {name},\n\nich bin auf {name} gestossen, als ich mir Immobilienmakler in {city} angesehen habe, und mir ist aufgefallen, dass {hook}.\n\nIch habe eine kostenlose Konzeptvorschau erstellt, wie eine moderne, mobil-optimierte Website fuer Sie aussehen koennte:\n{demo}\n\nWenn es Ihnen gefaellt, wuerde ich die echte Seite gerne umsetzen. Ich sende gern weitere Beispiele oder wir sprechen kurz.\n\nBeste Gruesse,\n[Ihr Name]\n\nKein Interesse? Antworten Sie einfach mit 'nein danke'.",
    h:{mobile:"Ihre Website nicht fuer Mobilgeraete optimiert ist, obwohl die meisten Immobiliensuchen heute mobil stattfinden",https:"Ihre Website nicht sicher ist (kein HTTPS), was Browser den Besuchern anzeigen",outdated:"Ihre Website seit einigen Jahren nicht aktualisiert wurde",slow:"Ihre Website langsam laedt und dadurch Besucher verliert",dated_build:"das Design Ihrer Website im Vergleich zur Konkurrenz veraltet wirkt",generic:"eine modernere Website mehr Besucher zu Anfragen machen koennte"}},
  fr:{s:"Une idee rapide pour le site de {name}",
    b:"Bonjour l'equipe de {name},\n\nj'ai decouvert {name} en regardant les agences immobilieres a {city}, et j'ai remarque que {hook}.\n\nJ'ai prepare un apercu gratuit de ce a quoi pourrait ressembler un site moderne et adapte au mobile :\n{demo}\n\nSi cela vous interesse, je serais ravi de creer la version reelle. Je peux envoyer d'autres exemples ou en discuter rapidement.\n\nCordialement,\n[Votre nom]\n\nPas interesse ? Repondez simplement 'non merci'.",
    h:{mobile:"votre site n'est pas adapte aux mobiles, alors que la plupart des recherches immobilieres se font desormais sur telephone",https:"votre site n'est pas securise (pas de HTTPS), ce que les navigateurs signalent aux visiteurs",outdated:"votre site ne semble pas avoir ete mis a jour depuis plusieurs annees",slow:"votre site se charge lentement, ce qui fait perdre des visiteurs",dated_build:"le design de votre site parait depasse face a la concurrence",generic:"un site plus moderne pourrait convertir plus de visiteurs en demandes"}},
  es:{s:"Una idea rapida para la web de {name}",
    b:"Hola equipo de {name},\n\ndescubri {name} mientras miraba inmobiliarias en {city}, y note que {hook}.\n\nPrepare una vista previa gratuita de como podria verse una web moderna y adaptada a moviles:\n{demo}\n\nSi les resulta util, me encantaria crear la version real. Puedo enviar mas ejemplos o hablar brevemente.\n\nUn saludo,\n[Tu nombre]\n\nNo te interesa? Responde 'no, gracias'.",
    h:{mobile:"su web no esta adaptada a moviles, cuando la mayoria de las busquedas de inmuebles ya se hacen desde el telefono",https:"su web no es segura (sin HTTPS), algo que los navegadores muestran a los visitantes",outdated:"su web no parece haberse actualizado en varios anos",slow:"su web carga lento y pierde visitantes",dated_build:"el diseno de su web se ve anticuado frente a la competencia",generic:"una web mas moderna podria convertir mas visitantes en consultas"}},
  it:{s:"Un'idea veloce per il sito di {name}",
    b:"Ciao team di {name},\n\nho scoperto {name} guardando le agenzie immobiliari a {city}, e ho notato che {hook}.\n\nHo preparato un'anteprima gratuita di come potrebbe essere un sito moderno e ottimizzato per il mobile:\n{demo}\n\nSe vi e utile, sarei felice di realizzare la versione vera. Posso inviare altri esempi o sentirci brevemente.\n\nCordiali saluti,\n[Il tuo nome]\n\nNon interessati? Rispondete 'no grazie'.",
    h:{mobile:"il vostro sito non e ottimizzato per i dispositivi mobili, mentre la maggior parte delle ricerche immobiliari avviene ormai da telefono",https:"il vostro sito non e sicuro (senza HTTPS), cosa che i browser segnalano ai visitatori",outdated:"il vostro sito non sembra aggiornato da alcuni anni",slow:"il vostro sito si carica lentamente e perde visitatori",dated_build:"il design del vostro sito appare datato rispetto ai concorrenti",generic:"un sito piu moderno potrebbe convertire piu visitatori in richieste"}},
  nl:{s:"Een kort idee voor de website van {name}",
    b:"Hallo team van {name},\n\nik kwam {name} tegen terwijl ik makelaars in {city} bekeek, en het viel me op dat {hook}.\n\nIk heb een gratis conceptvoorbeeld gemaakt van hoe een moderne, mobielvriendelijke website eruit zou kunnen zien:\n{demo}\n\nAls het nuttig is, maak ik graag de echte versie. Ik stuur gerust meer voorbeelden of we bellen even.\n\nMet vriendelijke groet,\n[Je naam]\n\nGeen interesse? Antwoord met 'nee bedankt'.",
    h:{mobile:"uw website niet mobielvriendelijk is, terwijl de meeste woningzoekopdrachten nu op de telefoon gebeuren",https:"uw website niet beveiligd is (geen HTTPS), wat browsers aan bezoekers tonen",outdated:"uw website al een paar jaar niet lijkt bijgewerkt",slow:"uw website traag laadt en bezoekers verliest",dated_build:"het ontwerp van uw website verouderd oogt vergeleken met concurrenten",generic:"een modernere website meer bezoekers in aanvragen kan omzetten"}},
  pt:{s:"Uma ideia rapida para o site da {name}",
    b:"Ola equipa da {name},\n\ndescobri a {name} enquanto via imobiliarias em {city}, e reparei que {hook}.\n\nPreparei uma pre-visualizacao gratuita de como poderia ser um site moderno e adaptado a telemoveis:\n{demo}\n\nSe for util, teria todo o gosto em criar a versao real. Posso enviar mais exemplos ou falar rapidamente.\n\nCumprimentos,\n[O seu nome]\n\nSem interesse? Responda 'nao obrigado'.",
    h:{mobile:"o seu site nao esta adaptado a telemoveis, quando a maioria das buscas de imoveis ja acontece no telemovel",https:"o seu site nao e seguro (sem HTTPS), algo que os navegadores mostram aos visitantes",outdated:"o seu site nao parece atualizado ha alguns anos",slow:"o seu site carrega devagar e perde visitantes",dated_build:"o design do seu site parece datado face a concorrencia",generic:"um site mais moderno poderia converter mais visitantes em contactos"}},
};
function draftFor(l){
  const t = DRAFTS[l.lang] || DRAFTS.en;
  const hook = (t.h[l.hook] || t.h.generic);
  const fill = str => str.replace(/{name}/g, l.name).replace(/{city}/g, l.city||"your area").replace(/{hook}/g, hook).replace(/{demo}/g, demoLink(l));
  return { subject: fill(t.s), body: fill(t.b) };
}
let LEADS = [], limit = 60;

async function init(){
  let d;
  try { d = await fetch("data/leads.json", { cache: "no-cache" }).then(r => r.json()); }
  catch(e){ $("#meta").textContent = "failed to load data"; return; }
  LEADS = d.leads || [];
  $("#meta").textContent = `updated ${(d.updated||"").replace("T"," ")} UTC · ${d.regions_done}/${d.regions_total} cities scanned`;
  $("#stats").innerHTML = [
    ["best-fit prospects", d.prospects||0], ["total leads", d.count], ["no website", d.nosite],
    ["emails found", d.with_email], ["deliverable (MX)", d.verified], ["campaign-ready", d.campaign],
  ].map(([l,n]) => `<div class="stat"><b>${(n||0).toLocaleString()}</b><span class="mut">${l}</span></div>`).join("");
  $("#note").innerHTML = "Sorted by <b>prospect fit</b>: small / starting-out agents (no website, or a weak DIY site, and not part of a big chain) rank highest, because they are the easiest to win. "
    + "Established brands and agencies with solid professional sites are pushed to the bottom. Turn on <b>Best-fit prospects only</b> to hide the rest.";
  const cs = Object.entries(d.by_country||{}).sort((a,b)=>b[1]-a[1]);
  $("#country").innerHTML = '<option value="">All countries</option>' + cs.map(([c,n])=>`<option value="${esc(c)}">${esc(c)} (${n})</option>`).join("");
  render();
}

function filtered(){
  const q = $("#q").value.trim().toLowerCase(), c = $("#country").value, has = $("#has").value;
  const seg = $("#seg").value, best = $("#best").checked;
  return LEADS.filter(l => {
    if(best && !l.prospect) return false;
    if(seg && (l.seg||"nosite") !== seg) return false;
    if(c && l.country !== c) return false;
    if(has === "email" && !l.email) return false;
    if(has === "phone" && !l.phone) return false;
    if(has === "campaign" && !l.campaign) return false;
    if(has === "channel" && !Object.keys(l.channels||{}).length) return false;
    if(has === "emailable" && !l.email && !Object.keys(l.channels||{}).length) return false;
    if(!q) return true;
    return (l.name+" "+l.city+" "+l.country+" "+l.brand+" "+l.phone+" "+l.email+" "+Object.values(l.channels||{}).join(" ")).toLowerCase().includes(q);
  });
}

const ISSUE = {mobile:"Not mobile-friendly", https:"No HTTPS (insecure)", outdated:"Not updated in years",
  slow:"Slow / heavy to load", dated_build:"Dated design/builder", generic:"Could convert better", unreached:"Site didn't respond"};
function leadRow(l){
  const chans = Object.entries(l.channels||{}).map(([k,v]) =>
    `<a class="ch" href="${esc((CH_URL[k]||(x=>x))(v))}" target="_blank" rel="noopener">${k}</a>`).join("");
  return `<div class="row"><div class="top">
      <span class="name">${esc(l.name)}</span>
      ${l.brand && l.brand!==l.name ? `<span class="pill brand">${esc(l.brand)}</span>`:""}
      <span class="pill">${esc(l.city)}${l.country?", "+esc(l.country):""}</span>
      ${l.fit!=null?`<span class="pill" style="color:${l.fit>=70?"var(--ok)":l.fit>=55?"var(--acc)":"var(--mut)"};border:1px solid ${l.fit>=55?"currentColor":"var(--line)"}" title="prospect fit: ${(l.fit_why||[]).join(', ')}">fit ${l.fit}</span>`:""}
      <span class="pill" style="color:${l.seg==="site"?"var(--warn)":"var(--acc)"}">${l.seg==="site"?"redesign":"build"}</span>
      ${l.qscore?`<span class="pill" title="redesign-worthiness">score ${l.qscore}</span>`:""}
      ${l.email_ok?`<span class="pill" style="color:var(--ok)">✓ deliverable</span>`:""}
      ${l.campaign?`<span class="pill" style="color:var(--ok);border:1px solid var(--ok)">campaign-ready</span>`:""}
    </div>
    ${l.seg==="site" && l.issues ? `<div class="weak"><span class="mut">site weaknesses:</span>${(l.issues.length===1&&l.issues[0]==="generic")?`<span class="wchip ok">Modern enough, sell an upgrade</span>`:l.issues.map(i=>`<span class="wchip">${ISSUE[i]||i}</span>`).join("")}</div>`:""}
    <div class="contacts">
      ${l.email ? `<a class="email" href="mailto:${esc(l.email)}">✉ ${esc(l.email)}</a>`:""}
      ${l.phone ? `<a class="phone" href="tel:${esc(l.phone.replace(/\s/g,''))}">☎ ${esc(l.phone)}</a>`:""}
      ${l.web ? `<a href="${esc(l.web)}" target="_blank" rel="noopener">🌐 site</a>`:""}
      ${l.seg==="site" ? `<a href="${esc(demoLink(l))}" target="_blank" rel="noopener">🎨 demo</a>`:""}
      ${l.email ? `<a href="#" class="draftbtn" data-id="${esc(l.id)}">✍ draft email</a>`:""}
      ${l.lat ? `<a href="https://www.openstreetmap.org/?mlat=${l.lat}&mlon=${l.lon}#map=18/${l.lat}/${l.lon}" target="_blank" rel="noopener">📍 map</a>`:""}
      ${chans}
    </div>
    ${l.addr ? `<div class="addr">${esc(l.addr)}</div>`:""}
    <div class="draftbox" data-id="${esc(l.id)}" hidden></div></div>`;
}

function render(){
  const ev = filtered();
  $("#out").innerHTML = ev.slice(0, limit).map(leadRow).join("")
    || `<div class="empty">No leads match. As more cities are scanned the list grows (see the counter up top).</div>`;
  $("#more").hidden = ev.length <= limit;
  $("#more").textContent = `Show more (${ev.length - limit} more)`;
}

function exportCSV(){
  const rows = filtered();
  const cols = ["fit","fit_reasons","name","brand","segment","email","email_source","phone","website","city","country","addr","channels","map"];
  const line = a => a.map(v => `"${String(v??"").replace(/"/g,'""')}"`).join(",");
  const body = rows.map(l => line([l.fit, (l.fit_why||[]).join("; "), l.name, l.brand, l.seg, l.email, l.email_src, l.phone, l.web, l.city, l.country, l.addr,
    Object.entries(l.channels||{}).map(([k,v])=>k+":"+v).join(" | "),
    l.lat?`https://www.openstreetmap.org/?mlat=${l.lat}&mlon=${l.lon}`:""]));
  const csv = [line(cols), ...body].join("\n");
  const url = URL.createObjectURL(new Blob([csv], {type:"text/csv"}));
  const a = document.createElement("a"); a.href = url; a.download = `leadscout-${rows.length}-leads.csv`;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}

["#q","#country","#has","#seg","#best"].forEach(s => $(s).addEventListener("input", () => { limit = 60; render(); }));
$("#more").onclick = () => { limit += 120; render(); };
$("#csv").onclick = exportCSV;

const byId = id => LEADS.find(l => l.id === id);
$("#out").addEventListener("click", e => {
  const d = e.target.closest(".draftbtn");
  if(d){
    e.preventDefault();
    const box = document.querySelector(`.draftbox[data-id="${CSS.escape(d.dataset.id)}"]`);
    if(!box) return;
    if(!box.hidden){ box.hidden = true; box.innerHTML = ""; return; }
    const l = byId(d.dataset.id); const dr = draftFor(l);
    box.hidden = false;
    box.innerHTML = `<div class="subj">Subject: <span class="subjtext">${esc(dr.subject)}</span> <span class="mut">(${(l.lang||"en").toUpperCase()})</span></div>
      <textarea class="bodytext">${esc(dr.body)}</textarea>
      <div class="acts">
        <button class="btn p copybtn">Copy email</button>
        <a class="btn" href="mailto:${esc(l.email)}?subject=${encodeURIComponent(dr.subject)}&body=${encodeURIComponent(dr.body)}">Open in mail app</a>
        <a class="btn" href="${esc(demoLink(l))}" target="_blank" rel="noopener">Open demo</a>
      </div>`;
    return;
  }
  const c = e.target.closest(".copybtn");
  if(c){
    const box = c.closest(".draftbox");
    const txt = "Subject: " + box.querySelector(".subjtext").textContent + "\n\n" + box.querySelector(".bodytext").value;
    navigator.clipboard.writeText(txt).then(()=>{ c.textContent = "Copied ✓"; setTimeout(()=>c.textContent="Copy email", 1500); });
  }
});
init();
</script>
</body>
</html>
