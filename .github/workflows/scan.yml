name: scan-leads

on:
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scan.py
      - name: Commit data
        run: |
          git config user.name "leadscout-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          git diff --cached --quiet || git commit -m "leads: scan $(date -u +%F)"
          for i in 1 2 3; do
            git fetch -q origin main
            git merge -X ours -m "merge" origin/main || git merge --abort || true
            git push && break || sleep $((RANDOM % 8 + 3))
          done
